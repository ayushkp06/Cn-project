<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#555"/></marker>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2f7d4f"/></marker>
  </defs>
  <rect width="900" height="560" fill="#ffffff"/>
  <text x="450" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="#222">P2P File Distribution System - Architecture</text>

  <!-- tracker -->
  <rect x="290" y="60" width="320" height="96" rx="10" fill="#e8eef7" stroke="#3b6ea5" stroke-width="2"/>
  <text x="450" y="86" text-anchor="middle" font-size="16" font-weight="bold" fill="#1f3d63">Tracker  (TCP :9000)</text>
  <text x="450" y="108" text-anchor="middle" font-size="12" fill="#333">file_id → metadata (size, CRC-32 per chunk, SHA-256)</text>
  <text x="450" y="126" text-anchor="middle" font-size="12" fill="#333">peer ip:port → chunks it has</text>
  <text x="450" y="144" text-anchor="middle" font-size="11" fill="#666" font-style="italic">stores NO file data</text>

  <!-- peers -->
  <g font-size="12" fill="#333">
    <rect x="40" y="300" width="220" height="110" rx="10" fill="#fdf3e3" stroke="#c98a2b" stroke-width="2"/>
    <text x="150" y="326" text-anchor="middle" font-size="15" font-weight="bold" fill="#7a4e0e">Peer A - Seeder</text>
    <text x="150" y="348" text-anchor="middle">TCP :9001</text>
    <text x="150" y="368" text-anchor="middle">has chunks 0 … N-1</text>
    <text x="150" y="388" text-anchor="middle">chunk server (thread/conn)</text>

    <rect x="340" y="300" width="220" height="110" rx="10" fill="#eaf5ee" stroke="#2f7d4f" stroke-width="2"/>
    <text x="450" y="326" text-anchor="middle" font-size="15" font-weight="bold" fill="#1d5434">Peer B - Downloader</text>
    <text x="450" y="348" text-anchor="middle">TCP :9002</text>
    <text x="450" y="368" text-anchor="middle">has chunks {0,3,5,…}</text>
    <text x="450" y="388" text-anchor="middle">downloads AND re-seeds</text>

    <rect x="640" y="300" width="220" height="110" rx="10" fill="#eaf5ee" stroke="#2f7d4f" stroke-width="2"/>
    <text x="750" y="326" text-anchor="middle" font-size="15" font-weight="bold" fill="#1d5434">Peer C - Downloader</text>
    <text x="750" y="348" text-anchor="middle">TCP :9003</text>
    <text x="750" y="368" text-anchor="middle">has chunks {1,2,4,…}</text>
    <text x="750" y="388" text-anchor="middle">downloads AND re-seeds</text>
  </g>

  <!-- control plane -->
  <g stroke="#555" stroke-width="1.6" stroke-dasharray="6 4" fill="none" marker-end="url(#a)">
    <line x1="170" y1="298" x2="350" y2="160"/>
    <line x1="450" y1="298" x2="450" y2="160"/>
    <line x1="730" y1="298" x2="550" y2="160"/>
  </g>
  <g font-size="11" fill="#444">
    <text x="190" y="215" transform="rotate(-37 190 215)">REGISTER (all chunks)</text>
    <text x="458" y="232">GET_PEERS</text>
    <text x="458" y="248">ANNOUNCE chunk</text>
    <text x="640" y="200" transform="rotate(37 640 200)">REGISTER / ANNOUNCE</text>
  </g>

  <!-- data plane -->
  <g stroke="#2f7d4f" stroke-width="2.4" fill="none" marker-end="url(#b)">
    <line x1="262" y1="345" x2="336" y2="345"/>
    <path d="M150,412 C150,490 750,490 750,414"/>
    <line x1="636" y1="365" x2="564" y2="365"/>
    <line x1="564" y1="385" x2="636" y2="385"/>
  </g>
  <g font-size="11" fill="#1d5434">
    <text x="268" y="338">CHUNK</text>
    <text x="450" y="482" text-anchor="middle">CHUNK (parallel, one TCP connection per peer)</text>
    <text x="600" y="358" text-anchor="middle">chunk 4</text>
    <text x="600" y="400" text-anchor="middle">chunk 3</text>
  </g>

  <!-- legend -->
  <g font-size="12" fill="#333">
    <line x1="60" y1="530" x2="110" y2="530" stroke="#555" stroke-width="1.6" stroke-dasharray="6 4"/>
    <text x="118" y="534">Control plane: small JSON messages to tracker</text>
    <line x1="470" y1="530" x2="520" y2="530" stroke="#2f7d4f" stroke-width="2.4"/>
    <text x="528" y="534">Data plane: 64 KB chunks, peer ↔ peer</text>
  </g>
</svg>
